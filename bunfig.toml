# Bun configuration with "bone strict" settings
# Enforces pnpm-style isolated linker to prevent phantom dependencies

[install]
# Enforces pnpm-style symlinked node_modules
# Prevents code from accessing dependencies it doesn't explicitly declare
linker = "isolated"

# Prevents Bun from auto-installing peer dependencies
# Forces explicit declaration of all dependencies
peer = false

# Prevents optional dependencies from being installed
optional = false
